<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#122c4a">
<meta name="description" content="ふじのえランドをiPhone・Androidのホーム画面に追加して遊ぼう。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ふじのえランド">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./fu-pyon-64.png">
<title>ふじのえランド｜アプリで楽しもう</title>
<style>
:root{font-family:"Hiragino Maru Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;color:#284563;background:#102945}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px 14px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 15%,#3a729c,#102945 75%)}
main{width:min(540px,100%);border-radius:28px;padding:24px clamp(17px,4vw,30px);background:#fff9ef;box-shadow:0 18px 50px #0005;text-align:center}
img{display:block;width:132px;height:132px;object-fit:contain;margin:0 auto 4px}h1{font-size:clamp(25px,6vw,34px);margin:0 0 8px;line-height:1.35;color:#255478}p{line-height:1.75;margin:8px auto 18px;font-size:16px}
a.primary,button.primary{display:block;width:100%;border:0;border-radius:20px;padding:17px 12px;background:#ed679b;color:white;text-decoration:none;font-family:inherit;font-weight:900;font-size:20px;line-height:1.4;box-shadow:0 5px 0 #bc4c78;cursor:pointer;min-height:59px}
a.primary:focus-visible,button.primary:focus-visible{outline:3px solid #ffb900;outline-offset:4px}
.note{font-size:13px;color:#6a6e75;margin:14px 0 0}
.guides{text-align:left;margin-top:24px;border-top:2px dashed #e7c99f;padding-top:14px}
.guides h2{font-size:18px;margin:5px 0 12px;text-align:center}
.guide{background:#fff;border:1px solid #f0d8b9;border-radius:16px;padding:12px 14px;margin:10px 0}
.guide strong{display:block;color:#245a83;margin-bottom:4px;font-size:16px}
.guide p{font-size:15px;margin:0;line-height:1.7}
#install{display:none;margin-top:12px;background:#387ec5;box-shadow:0 5px 0 #24588e}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<script>
(()=>{'use strict';
const standalone=matchMedia('(display-mode:standalone)').matches||navigator.standalone===true;
if(standalone){location.replace('./index.html');return}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).catch(()=>{}),{once:true});
}
let installEvent=null;
window.addEventListener('beforeinstallprompt',e=>{
e.preventDefault();installEvent=e;
const button=document.getElementById('install');if(button)button.style.display='block';
});
window.addEventListener('DOMContentLoaded',()=>{
const button=document.getElementById('install');if(!button)return;
button.addEventListener('click',async()=>{
if(!installEvent)return;
const prompt=installEvent;installEvent=null;button.disabled=true;
try{await prompt.prompt()}catch(_){}
button.disabled=false;button.style.display='none';
});
});
})();
</script>
</head>
<body>
<main>
<img src="./fu-pyon.webp" alt="ふーぴょん">
<h1>ふじのえランド</h1>
<p>ホーム画面に追加すると、いつでもランドへ遊びに来られるよ。</p>
<a class="primary" href="./index.html">ふじのえランドを開く</a>
<button id="install" class="primary" type="button">アプリを追加する</button>
<div class="guides">
<h2>ホーム画面への追加方法</h2>
<div class="guide"><strong>iPhone・iPad（Safari）</strong><p>共有メニュー →「ホーム画面に追加」→「Webアプリとして開く」をオン →「追加」。</p></div>
<div class="guide"><strong>Android（Chrome）</strong><p>メニューから「アプリをインストール」または「ホーム画面に追加」を選択。</p></div>
</div>
<p class="note">インストールや利用のためのログインは不要。ゲームの記録は、端末のブラウザ保存に依存します。</p>
</main>
</body>
</html>
